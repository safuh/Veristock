name: Veristock CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: veristock-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} / quality and integration tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backbone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backbone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/backbone
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/backbone

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Tests and PostgreSQL migration verification
        run: uv run pytest

  frontend:
    name: React workspace / typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      - name: Build browser application
        run: npm run build

  mobile:
    name: Flutter Android client / analyze, tests and debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner when absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=veristock_mobile --org=com.veristock .
          fi
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Flutter application
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
